name: Merge birthday effect
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply birthday effect merge
        run: |
          echo '' | base64 -d > /tmp/merge_birthday.py
          python /tmp/merge_birthday.py
          node --check effects.js
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add effects.js agenda-export.js index.html
          git commit -m 'Combine confetti streamers and balloons into birthday effect'
          git push
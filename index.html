<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Rooster bekijken</title>
<style>
*{box-sizing:border-box}:root{color-scheme:light;--ink:#172033;--muted:#64748b;--line:#dbe2ea;--surface:#fff;--page:#f3f5f8;--accent:#7b2f73;--accent-dark:#542450;--danger:#b42336}html,body{margin:0;min-height:100%}body{min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:var(--page);color:var(--ink)}body.locked{overflow:hidden}[hidden]{display:none!important}.overlay{position:fixed;inset:0;z-index:10000;display:grid;place-items:center;padding:20px;background:rgba(15,23,42,.82)}.welcome-card{width:min(760px,100%);min-height:310px;display:flex;align-items:flex-end;justify-content:center;padding:28px;border-radius:26px;overflow:hidden;box-shadow:0 28px 80px rgba(0,0,0,.34);background:#fff url("KCD.jpg") center/contain no-repeat}.welcome-content{width:min(390px,100%);padding:18px 22px 22px;text-align:center;border:1px solid rgba(255,255,255,.8);border-radius:18px;background:rgba(255,255,255,.88);backdrop-filter:blur(4px);box-shadow:0 12px 34px rgba(15,23,42,.18)}.welcome-content h1,.unlock-card h1,.search-card h1{margin:0}.welcome-content h1{font-size:clamp(26px,4vw,34px)}.unlock-card{width:min(430px,100%);padding:30px;border-radius:22px;background:var(--surface);box-shadow:0 28px 80px rgba(0,0,0,.34)}.unlock-card p,.search-intro{color:var(--muted)}.unlock-card p{margin:9px 0 24px;line-height:1.45}label{display:block;margin:15px 0 7px;font-weight:700}input{width:100%;padding:13px 14px;border:1px solid #c9d2dc;border-radius:12px;background:#fff;color:var(--ink);font:inherit;font-size:16px;outline:none}input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(123,47,115,.12)}button{border:0;border-radius:12px;padding:13px 17px;background:var(--accent);color:#fff;font:inherit;font-weight:700;cursor:pointer}button:hover{background:var(--accent-dark)}button:disabled{opacity:.58;cursor:wait}.full-button{width:100%;margin-top:22px}.error{min-height:20px;margin-top:12px;color:var(--danger);font-size:14px;font-weight:700}#app{min-height:100vh;padding:52px 20px}.search-card{width:min(820px,100%);margin:0 auto;padding:32px;border-radius:22px;background:var(--surface);box-shadow:0 18px 52px rgba(15,23,42,.09)}.search-intro{margin:9px 0 24px;line-height:1.5}.search-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}.name-field{position:relative}.suggestions{position:absolute;z-index:30;left:0;right:0;top:calc(100% + 6px);max-height:280px;overflow-y:auto;padding:6px;border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:0 16px 38px rgba(15,23,42,.16)}.suggestion{display:block;width:100%;margin:0;padding:11px 12px;border-radius:8px;background:transparent;color:var(--ink);text-align:left;font-weight:700}.suggestion:hover,.suggestion.active{background:#f2eaf1;color:var(--accent-dark)}.search-row button{min-width:150px}.search-message{min-height:22px;margin-top:12px;color:var(--danger);font-weight:700;font-size:14px}.roster-result{margin-top:28px;border-top:1px solid var(--line);padding-top:26px}.employee-head{display:flex;gap:16px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}.employee-name{margin:0;font-size:25px}.employee-team{color:var(--muted);font-weight:700}.period{margin:8px 0 0;color:var(--muted)}.schedule-list{display:grid;gap:14px;margin-top:22px}.schedule-card{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fbfcfd}.schedule-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 17px;background:#fff;border-bottom:1px solid var(--line)}.schedule-date{font-weight:800}.schedule-time{color:var(--muted);font-weight:700;white-space:nowrap}.activities{display:grid;gap:8px;padding:13px 17px 16px}.activity{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:13px 10px 9px;overflow:hidden;border:1px solid #edf0f4;border-radius:10px;background:#fff;color:var(--ink)}.activity:before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:var(--activity-color,#dbe2ea)}.activity-name{font-weight:700;overflow-wrap:anywhere}.activity-time{color:var(--muted);font-size:14px;white-space:nowrap}.no-activities{color:var(--muted);padding:4px 0}@media(max-width:620px){.welcome-card{min-height:270px;padding:20px}.welcome-content{padding:16px 18px 19px}.unlock-card,.search-card{padding:23px}#app{padding:28px 12px}.search-row{grid-template-columns:1fr}.search-row button{width:100%}.schedule-head{align-items:flex-start;flex-direction:column}.activity{display:flex;align-items:flex-start;gap:5px;padding-top:13px}}
</style>
</head>
<body class="locked">
<div id="welcomeOverlay" class="overlay" aria-modal="true" role="dialog" aria-labelledby="welcomeTitle"><section class="welcome-card"><div class="welcome-content"><h1 id="welcomeTitle">Welkom Collega's</h1><button id="continueButton" class="full-button" type="button">Verder</button></div></section></div>
<div id="unlockOverlay" class="overlay" aria-modal="true" role="dialog" aria-labelledby="unlockTitle" hidden><form id="unlockForm" class="unlock-card" autocomplete="off"><h1 id="unlockTitle">Rooster ontgrendelen</h1><p>Vul het ID en wachtwoord in waarmee het roosterbestand is beveiligd.</p><label for="rosterId">ID</label><input id="rosterId" type="text" autocomplete="off" required><label for="rosterPassword">Wachtwoord</label><input id="rosterPassword" type="password" autocomplete="new-password" required><button id="unlockButton" class="full-button" type="submit">Rooster ontgrendelen</button><div id="unlockError" class="error" aria-live="polite"></div></form></div>
<main id="app" hidden><section class="search-card"><h1>Rooster bekijken</h1><p class="search-intro">Voer je voor of achternaam in. De volgorde van je voornaam en achternaam maakt niet uit.</p><form id="nameForm" autocomplete="off"><label for="employeeName">Naam</label><div class="search-row"><div class="name-field"><input id="employeeName" type="text" autocomplete="off" spellcheck="false" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="nameSuggestions" required><div id="nameSuggestions" class="suggestions" role="listbox" hidden></div></div><button type="submit">Rooster bekijken</button></div></form><div id="searchMessage" class="search-message" aria-live="polite"></div><section id="rosterResult" class="roster-result" hidden></section></section></main>
<script>
(()=>{"use strict";const ROSTER_FILE="Roosterindex_September.json",decoder=new TextDecoder(),encoder=new TextEncoder();let rosterIndex=null,encryptedIndex=null,suggestionMatches=[],activeSuggestion=-1;const $=id=>document.getElementById(id),welcomeOverlay=$("welcomeOverlay"),continueButton=$("continueButton"),unlockOverlay=$("unlockOverlay"),unlockForm=$("unlockForm"),rosterId=$("rosterId"),rosterPassword=$("rosterPassword"),unlockButton=$("unlockButton"),unlockError=$("unlockError"),app=$("app"),nameForm=$("nameForm"),employeeName=$("employeeName"),searchMessage=$("searchMessage"),rosterResult=$("rosterResult"),nameSuggestions=$("nameSuggestions");
function base64ToBytes(v){const b=atob(v),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}async function loadEncryptedIndex(){if(encryptedIndex)return encryptedIndex;const r=await fetch(`${ROSTER_FILE}?v=${Date.now()}`,{cache:"no-store"});if(!r.ok)throw new Error("Het roosterbestand kon niet worden geladen.");const d=await r.json();if(d?.kind!=="roosterhulp-encrypted-index"||d?.encrypted!==true||!d.crypto||!d.payload)throw new Error("Het roosterbestand heeft niet het verwachte beveiligde formaat.");return encryptedIndex=d}async function decryptIndex(id,pw){if(!crypto?.subtle)throw new Error("Deze browser ondersteunt de vereiste versleuteling niet.");const d=await loadEncryptedIndex(),c=d.crypto,secret=encoder.encode(`${id}\u0000${pw}`),mat=await crypto.subtle.importKey("raw",secret,"PBKDF2",false,["deriveKey"]),key=await crypto.subtle.deriveKey({name:"PBKDF2",hash:c.hash||"SHA-256",salt:base64ToBytes(c.salt),iterations:Number(c.iterations)||250000},mat,{name:"AES-GCM",length:Number(c.keyLength)||256},false,["decrypt"]),plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:base64ToBytes(c.iv)},key,base64ToBytes(d.payload)),parsed=JSON.parse(decoder.decode(plain));if(parsed?.kind!=="roosterhulp-index"||!Array.isArray(parsed.employees))throw new Error("Het ontsleutelde roosterbestand is ongeldig.");return parsed}
function norm(v){return String(v||"").toLocaleLowerCase("nl-NL").normalize("NFD").replace(/\p{M}/gu,"").replace(/[^\p{L}\p{N}]+/gu," ").trim().replace(/\s+/g," ")}function sig(v){return norm(v).split(" ").filter(Boolean).sort((a,b)=>a.localeCompare(b,"nl")).join("|")}function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}function safeColor(v){const c=String(v||"").trim();return /^#[0-9a-f]{3}([0-9a-f]{3})?$/i.test(c)?c:"#dbe2ea"}function hideSuggestions(){suggestionMatches=[];activeSuggestion=-1;nameSuggestions.hidden=true;nameSuggestions.innerHTML="";employeeName.setAttribute("aria-expanded","false");employeeName.removeAttribute("aria-activedescendant")}function renderSuggestions(){if(!rosterIndex)return hideSuggestions();const q=norm(employeeName.value);if(!q)return hideSuggestions();const parts=q.split(" ").filter(Boolean);suggestionMatches=rosterIndex.employees.filter(e=>{const n=norm(e.name);return parts.every(p=>n.includes(p))}).sort((a,b)=>String(a.name).localeCompare(String(b.name),"nl-NL"));activeSuggestion=-1;if(!suggestionMatches.length)return hideSuggestions();nameSuggestions.innerHTML=suggestionMatches.map((e,i)=>`<button class="suggestion" id="nameSuggestion-${i}" role="option" type="button" data-index="${i}">${esc(e.name)}</button>`).join("");nameSuggestions.hidden=false;employeeName.setAttribute("aria-expanded","true")}function selectSuggestion(i){const e=suggestionMatches[i];if(!e)return;employeeName.value=e.name;hideSuggestions();employeeName.focus()}function fmtDate(v){if(!v)return"Datum onbekend";const d=new Date(`${String(v).slice(0,10)}T12:00:00`);return Number.isNaN(d.getTime())?String(v):new Intl.DateTimeFormat("nl-NL",{weekday:"long",day:"numeric",month:"long",year:"numeric"}).format(d)}function fmtTime(v){if(!v)return"";const s=String(v),m=s.match(/(?:T|^)(\d{2}):(\d{2})/)||s.match(/^(\d{1,2}):(\d{2})$/);return m?`${m[1].padStart(2,"0")}:${m[2]}`:s}function range(a,b){a=fmtTime(a);b=fmtTime(b);return a&&b?`${a} – ${b}`:a||b||""}
function renderEmployee(e){const schedules=Array.isArray(e.schedules)?[...e.schedules]:[];schedules.sort((a,b)=>String(a.date||"").localeCompare(String(b.date||""))||String(a.start||"").localeCompare(String(b.start||"")));const period=rosterIndex?.period?.label&&rosterIndex.period.label!=="unknown"?rosterIndex.period.label:"",cards=schedules.map(s=>{const acts=Array.isArray(s.activities)?s.activities:[],ah=acts.length?acts.map(a=>`<div class="activity" style="--activity-color:${safeColor(a.color)}"><span class="activity-name">${esc(a.name||a.type||"Activiteit")}</span><span class="activity-time">${esc(range(a.start,a.end))}</span></div>`).join(""):'<div class="no-activities">Geen roosteronderdelen beschikbaar.</div>';return `<article class="schedule-card"><header class="schedule-head"><span class="schedule-date">${esc(fmtDate(s.date))}</span><span class="schedule-time">${esc(range(s.start,s.end))}</span></header><div class="activities">${ah}</div></article>`}).join("");rosterResult.innerHTML=`<div class="employee-head"><h2 class="employee-name">${esc(e.name)}</h2>${e.team?`<span class="employee-team">${esc(e.team)}</span>`:""}</div>${period?`<p class="period">Periode: ${esc(period)}</p>`:""}<div class="schedule-list">${cards||'<div class="no-activities">Geen roosterregels gevonden.</div>'}</div>`;rosterResult.hidden=false}
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&(!welcomeOverlay.hidden||!unlockOverlay.hidden))ev.preventDefault()},true);welcomeOverlay.addEventListener("click",ev=>{if(ev.target===welcomeOverlay)ev.preventDefault()});unlockOverlay.addEventListener("click",ev=>{if(ev.target===unlockOverlay){ev.preventDefault();(rosterId.value.trim()?rosterPassword:rosterId).focus()}});continueButton.addEventListener("click",()=>{welcomeOverlay.hidden=true;unlockOverlay.hidden=false;unlockError.textContent="";requestAnimationFrame(()=>rosterId.focus());loadEncryptedIndex().catch(()=>{})});unlockForm.addEventListener("submit",async ev=>{ev.preventDefault();const id=rosterId.value.trim(),pw=rosterPassword.value;if(!id||!pw)return;unlockButton.disabled=true;unlockButton.textContent="Ontgrendelen…";unlockError.textContent="";try{rosterIndex=await decryptIndex(id,pw);rosterPassword.value="";rosterId.value="";unlockOverlay.hidden=true;app.hidden=false;document.body.classList.remove("locked");requestAnimationFrame(()=>employeeName.focus())}catch(err){rosterPassword.value="";rosterPassword.focus();unlockError.textContent=err?.message?.includes("geladen")||err?.message?.includes("formaat")||err?.message?.includes("browser")?err.message:"ID of wachtwoord is onjuist."}finally{unlockButton.disabled=false;unlockButton.textContent="Rooster ontgrendelen"}});employeeName.addEventListener("input",()=>{searchMessage.textContent="";renderSuggestions()});employeeName.addEventListener("keydown",ev=>{if(nameSuggestions.hidden||!suggestionMatches.length)return;if(ev.key==="ArrowDown"||ev.key==="ArrowUp"){ev.preventDefault();activeSuggestion=(activeSuggestion+(ev.key==="ArrowDown"?1:-1)+suggestionMatches.length)%suggestionMatches.length;[...nameSuggestions.querySelectorAll(".suggestion")].forEach((b,i)=>b.classList.toggle("active",i===activeSuggestion));employeeName.setAttribute("aria-activedescendant",`nameSuggestion-${activeSuggestion}`)}else if(ev.key==="Enter"&&activeSuggestion>=0){ev.preventDefault();selectSuggestion(activeSuggestion)}else if(ev.key==="Escape")hideSuggestions()});nameSuggestions.addEventListener("mousedown",ev=>{const b=ev.target.closest(".suggestion");if(!b)return;ev.preventDefault();selectSuggestion(Number(b.dataset.index))});document.addEventListener("click",ev=>{if(!ev.target.closest(".name-field"))hideSuggestions()});nameForm.addEventListener("submit",ev=>{ev.preventDefault();searchMessage.textContent="";hideSuggestions();rosterResult.hidden=true;rosterResult.innerHTML="";const s=sig(employeeName.value);if(!s||!rosterIndex)return void(searchMessage.textContent="Geen rooster gevonden voor deze naam.");const m=rosterIndex.employees.filter(e=>sig(e.name)===s);if(m.length!==1)return void(searchMessage.textContent="Geen rooster gevonden voor deze naam.");renderEmployee(m[0])})})();
</script>
</body>
</html>

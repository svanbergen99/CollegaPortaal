name: Repo health

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check local references and JavaScript syntax
        id: health
        shell: bash
        run: |
          set +e
          node tools/repo-health-check.mjs 2>&1 | tee repo-health-report.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repo-health-report
          path: repo-health-report.txt
          retention-days: 3
      - name: Enforce health result
        if: steps.health.outputs.exit_code != '0'
        run: exit 1

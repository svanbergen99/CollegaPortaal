name: Refine portal effects

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refine-effects:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply effects refinement
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/refine_portal_effects.py
          python /tmp/refine_portal_effects.py
          node --check effects.js
          node --check holiday-scenes.js
      - name: Commit refinement
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add effects.js effects.css holiday-scenes.js holiday-scenes.css agenda-export.js index.html
          git commit -m "Refine portal effects performance and holiday layout"
          git push
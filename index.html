<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rooster bekijken</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; font-family: Arial, sans-serif; background: #f4f6f8; color: #1f2937; }
    body.locked { overflow: hidden; }

    #app { min-height: 100vh; padding: 48px 20px; }
    .page-card { max-width: 760px; margin: 0 auto; background: #fff; border-radius: 20px; padding: 32px; box-shadow: 0 18px 50px rgba(0,0,0,.08); }

    .welcome-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background: rgba(15,23,42,.82);
      padding: 20px;
    }

    .welcome-overlay.hidden { display: none; }

    .welcome-card {
      width: min(720px, 100%);
      min-height: 260px;
      border-radius: 24px;
      padding: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
      box-shadow: 0 24px 70px rgba(0,0,0,.32);
      background:
        linear-gradient(rgba(255,255,255,.50), rgba(255,255,255,.50)),
        url("KCD.jpg") center / cover no-repeat;
    }

    .welcome-content {
      width: min(380px, 100%);
      padding: 22px;
      border-radius: 18px;
      background: rgba(255,255,255,.84);
      backdrop-filter: blur(3px);
      box-shadow: 0 10px 35px rgba(15,23,42,.16);
    }

    .welcome-card h1 {
      margin: 0;
      font-size: 30px;
      color: #172033;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 13px 16px;
      border: 0;
      border-radius: 12px;
      background: #0f172a;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { background: #1e293b; }

    @media (max-width: 600px) {
      .welcome-card { min-height: 230px; padding: 20px; }
      .welcome-content { padding: 18px; }
      .welcome-card h1 { font-size: 26px; }
    }
  </style>
</head>
<body class="locked">
  <div id="welcomeOverlay" class="welcome-overlay" aria-modal="true" role="dialog" aria-labelledby="welcomeTitle">
    <div class="welcome-card">
      <div class="welcome-content">
        <h1 id="welcomeTitle">Welkom Collega's</h1>
        <button id="continueButton" type="button">Verder</button>
      </div>
    </div>
  </div>

  <main id="app">
    <div class="page-card">
      <h1>Rooster bekijken</h1>
      <p>Voer je naam in om je rooster te bekijken.</p>
    </div>
  </main>

  <script>
    (() => {
      const overlay = document.getElementById("welcomeOverlay");
      const continueButton = document.getElementById("continueButton");

      continueButton.addEventListener("click", () => {
        overlay.classList.add("hidden");
        document.body.classList.remove("locked");
      });

      document.addEventListener("keydown", (event) => {
        if (!overlay.classList.contains("hidden") && event.key === "Escape") {
          event.preventDefault();
        }
      });

      overlay.addEventListener("click", (event) => {
        if (event.target === overlay) {
          event.preventDefault();
        }
      });
    })();
  </script>
</body>
</html>

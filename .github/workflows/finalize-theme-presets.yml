name: Finalize theme presets

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate presets and bump loader reference
        shell: bash
        run: |
          node --check theme-quick-choices.js
          node --check theme-background-color.js
          node --check external-theme-buttons.js
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '<script src="agenda-export.js?v=20260903-59"></script>'
          new = '<script src="agenda-export.js?v=20260903-60"></script>'
          if old not in text:
              raise SystemExit('oude loaderverwijzing niet gevonden')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit index update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Bump portal loader for theme presets"
          git push
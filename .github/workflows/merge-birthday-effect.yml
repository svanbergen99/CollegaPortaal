name: Merge birthday effect

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  merge-effect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Merge confetti streamers and balloons
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('effects.js')
          text = path.read_text(encoding='utf-8')

          old_menu = '''    { id: "confetti", label: "Confetti", icon: "🎉" },
    { id: "streamers", label: "Slingers", icon: "🎊" },
    { id: "orange", label: "Oranje feest", icon: "🧡" },
    { id: "hearts", label: "Hartjes", icon: "❤️" },
    { id: "balloons", label: "Ballonnen", icon: "🎈" },'''
          new_menu = '''    { id: "birthday", label: "Verjaardag", icon: "🎂" },
    { id: "orange", label: "Oranje feest", icon: "🧡" },
    { id: "hearts", label: "Hartjes", icon: "❤️" },'''
          if old_menu not in text:
              raise SystemExit('effectenmenu niet gevonden')
          text = text.replace(old_menu, new_menu, 1)

          old_cases = '''      case "confetti":
        sceneGlow = { colors: ["#fffbeb", "#fdf2f8"], strength: .055 };
        confettiCannons(COLORS, MOBILE() ? 70 : 120);
        confettiRain(MOBILE() ? 170 : 300, COLORS);
        addEmitter(1250, 5600, () => confettiCannons(COLORS, MOBILE() ? 42 : 68), false);
        duration = 7600;
        break;
      case "streamers":
        sceneGlow = { colors: ["#faf5ff", "#eff6ff"], strength: .06 };
        confettiCannons(COLORS, MOBILE() ? 65 : 110);
        confettiRain(MOBILE() ? 145 : 245, COLORS, .8);
        addEmitter(900, 6200, () => confettiRain(MOBILE() ? 28 : 48, COLORS, .16), false);
        duration = 7900;
        break;'''
          new_case = '''      case "birthday":
        sceneGlow = { colors: ["#fffbeb", "#fdf2f8", "#eff6ff"], strength: .06 };
        confettiCannons(COLORS, MOBILE() ? 58 : 92);
        confettiRain(MOBILE() ? 90 : 145, COLORS, .58);
        balloons(MOBILE() ? 18 : 30, COLORS);
        addEmitter(720, 2100, () => confettiRain(MOBILE() ? 12 : 20, COLORS, .12), false);
        addEmitter(1100, 2100, () => balloons(MOBILE() ? 4 : 7, COLORS), false);
        duration = 3100;
        break;'''
          if old_cases not in text:
              raise SystemExit('confetti/slingers cases niet gevonden')
          text = text.replace(old_cases, new_case, 1)

          old_balloon = '''      case "balloons":
        sceneGlow = { colors: ["#eff6ff", "#fff7ed"], strength: .05 };
        balloons(MOBILE() ? 48 : 82, COLORS);
        addEmitter(1350, 6800, () => balloons(MOBILE() ? 12 : 20, COLORS), false);
        duration = 9300;
        break;
'''
          if old_balloon not in text:
              raise SystemExit('ballonnen-case niet gevonden')
          text = text.replace(old_balloon, '', 1)
          path.write_text(text, encoding='utf-8')

          agenda = Path('agenda-export.js')
          loader = agenda.read_text(encoding='utf-8')
          old_version = 'const VERSION = "20260903-60";'
          new_version = 'const VERSION = "20260903-61";'
          if old_version not in loader:
              raise SystemExit('loader versie 60 niet gevonden')
          agenda.write_text(loader.replace(old_version, new_version, 1), encoding='utf-8')

          index = Path('index.html')
          page = index.read_text(encoding='utf-8')
          old_ref = '<script src="agenda-export.js?v=20260903-60"></script>'
          new_ref = '<script src="agenda-export.js?v=20260903-61"></script>'
          if old_ref not in page:
              raise SystemExit('index loader versie 60 niet gevonden')
          index.write_text(page.replace(old_ref, new_ref, 1), encoding='utf-8')
          PY
          node --check effects.js
      - name: Commit birthday effect
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add effects.js agenda-export.js index.html
          git commit -m "Combine confetti streamers and balloons into birthday effect"
          git push